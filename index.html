<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#24157a">
<title>Потасовка — арена бойцов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1240;font-family:"Russo One","Arial Black",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
#bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 35%,#4b7bff 0%,#3a3fd6 35%,#24157a 75%,#170c4a 100%);z-index:0}
#bg:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 2px,transparent 2.5px);background-size:34px 34px;opacity:.7}
body.inmatch #bg{background:#203040}
#gl,#ov{position:fixed;inset:0;width:100%;height:100%;display:block}
#gl{z-index:1}#ov{z-index:2;pointer-events:none}
#ui{position:fixed;inset:0;z-index:5;pointer-events:none}
#ui>*{pointer-events:auto}
#hud{position:fixed;inset:0;z-index:4;display:none}
#hud.on{display:block}
#modal{position:fixed;inset:0;z-index:20;display:none}
#modal.show{display:block}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toastmsg{background:#14101ee6;border:2px solid #ffd23f;padding:10px 18px;border-radius:12px;font-size:15px;transition:.4s;text-align:center}
.toastmsg.out{opacity:0;transform:translateY(-10px)}
#loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#24157a;font-size:22px;gap:14px;text-align:center;padding:20px}
#loading b{font-size:44px;color:#ffd23f;text-shadow:0 4px 0 #14101e}
.ic{display:inline-block;width:1.25em;height:1.25em;vertical-align:-0.28em}
.ic svg{width:100%;height:100%}
.ic.big{width:2.4em;height:2.4em}
.st,.btn,h1,h2,h3,b{text-shadow:0 2px 0 #14101e,1px 0 0 #14101e,-1px 0 0 #14101e,0 -1px 0 #14101e}
/* buttons */
.btn{border:3px solid #14101e;border-radius:12px;padding:10px 18px;font-size:17px;color:#fff;background:linear-gradient(#b8c3d9,#7e8aa8);box-shadow:0 4px 0 #14101e,inset 0 -4px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #14101e}
.btn.yellow{background:linear-gradient(#ffe45a,#ffb81f);color:#fff}
.btn.blue{background:linear-gradient(#5ab0ff,#2a6fe0)}
.btn.green{background:linear-gradient(#7ef06a,#2fb84a)}
.btn.red{background:linear-gradient(#ff7a7a,#e0303f)}
.btn.small{padding:6px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%;margin:6px 0}
.btn .ic{width:1.1em;height:1.1em}
.cost{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;justify-content:center;margin:8px 0}
.row.wrap{flex-wrap:wrap;gap:6px}
.note{font-size:12px;opacity:.75;text-align:center;font-family:system-ui,sans-serif;line-height:1.35}
/* top bar */
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));z-index:3}
.topbar h2{margin:0;font-size:22px;flex:1}
.back{border:3px solid #14101e;background:linear-gradient(#5ab0ff,#2a6fe0);color:#fff;font-size:18px;width:44px;height:40px;border-radius:10px;box-shadow:0 3px 0 #14101e}
.curs{display:flex;gap:6px;margin-left:auto}
.cur{display:flex;align-items:center;gap:4px;background:#14101ecc;border:2px solid #0008;border-radius:20px;padding:3px 10px 3px 4px;font-size:14px}
.cur .ic{width:22px;height:22px}
.profile{display:flex;align-items:center;gap:8px;background:#14101e99;border-radius:12px;padding:4px 12px 4px 4px;cursor:pointer;border:2px solid #0006}
.profile img{width:44px;height:44px;border-radius:10px;background:#3a5aff;border:2px solid #14101e}
.profile b{display:block;font-size:15px}
.tro{font-size:14px;color:#ffd23f}
.roadbar{display:flex;align-items:center;gap:6px;background:#14101e99;border-radius:12px;padding:4px 10px;cursor:pointer;position:relative;font-size:13px}
.rb{width:120px;height:10px;background:#0008;border-radius:6px;overflow:hidden}.rb i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff9a1a)}
.badge{position:absolute;top:-6px;right:-6px;background:#ff3d5e;border:2px solid #14101e;border-radius:12px;min-width:22px;height:22px;font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* lobby */
.lobby{position:absolute;inset:0}
.leftnav{position:absolute;left:max(12px,env(safe-area-inset-left));top:78px;display:flex;flex-direction:column;gap:8px}
.nav{position:relative;display:flex;align-items:center;gap:10px;width:150px;padding:8px 10px;border:3px solid #14101e;border-radius:12px;background:linear-gradient(#5a8cff,#3a5ae0);color:#fff;font-size:15px;box-shadow:0 3px 0 #14101e}
.nav:active{transform:translateY(2px)}
.nav .ni{font-size:20px;width:26px;text-align:center}
.binfo{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);text-align:center;cursor:pointer}
.bname{font-size:30px;text-shadow:0 3px 0 #14101e,2px 0 0 #14101e,-2px 0 0 #14101e,0 -2px 0 #14101e}
.brow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:13px;margin-top:4px}
.brow>span,.bhead>span{background:#14101ecc;border-radius:8px;padding:3px 8px}
.rar{color:#14101e;text-shadow:none!important}
.lvl{background:linear-gradient(#e07aff,#9a3ad6)!important}
.btro{color:#ffd23f}
.rightplay{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;align-items:stretch;width:300px}
.modebtn{display:flex;align-items:center;gap:10px;text-align:left;border:3px solid #14101e;border-radius:14px;padding:8px 12px;background:linear-gradient(var(--mc),color-mix(in srgb,var(--mc) 60%,#14101e));color:#fff;box-shadow:0 4px 0 #14101e}
.modebtn .mi{font-size:30px}.modebtn b{display:block;font-size:17px}.modebtn small{font-size:12px;opacity:.9}
.playrow{display:flex;gap:10px}
.play{flex:1;font-size:30px;padding:14px 10px;border-radius:16px}
.friends{display:flex;flex-direction:column;align-items:center;font-size:22px;padding:6px 10px}
.friends small{font-size:11px}
/* panels */
.panel.full{position:absolute;inset:0;background:linear-gradient(#2a3ad8ee,#1c1270f2);overflow:hidden;display:flex;flex-direction:column}
.panel.full>.topbar{position:relative}
.modegrid,.bgrid,.shop,.quests,.caps,.room{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px max(14px,env(safe-area-inset-right)) 24px max(14px,env(safe-area-inset-left));touch-action:pan-y}
.modegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-content:start}
.modecard{border:3px solid #14101e;border-radius:14px;padding:10px;background:linear-gradient(color-mix(in srgb,var(--mc) 85%,#fff),color-mix(in srgb,var(--mc) 55%,#14101e));box-shadow:0 4px 0 #14101e}
.modecard.sel{outline:3px solid #ffd23f}
.modecard .mh{display:flex;align-items:center;gap:8px;font-size:18px}.mh .mi{font-size:26px}
.modecard p{font-family:system-ui,sans-serif;font-size:12.5px;margin:6px 0;opacity:.95}
.maps{display:flex;flex-wrap:wrap;gap:6px}
.mapbtn{border:2px solid #14101e;border-radius:10px;background:#14101e88;color:#fff;padding:6px 10px;font-size:13px;display:flex;flex-direction:column;align-items:flex-start}
.mapbtn small{font-size:10px;opacity:.7}.mapbtn.on{background:#ffd23f;color:#14101e}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;align-content:start}
.bgrid.small{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));max-height:60vh;overflow-y:auto;padding:4px}
.bcard{border:3px solid #14101e;border-radius:12px;background:linear-gradient(var(--rc),var(--rd));overflow:hidden;cursor:pointer;box-shadow:0 3px 0 #14101e;position:relative}
.bcard img{width:100%;aspect-ratio:1;display:block;background:radial-gradient(#ffffff55,#0000)}
.bcard.locked img{filter:grayscale(1) brightness(.6)}
.bcard.sel{outline:3px solid #fff}
.bc-name{font-size:14px;text-align:center;padding:2px 4px;background:#14101e88;text-shadow:0 2px 0 #14101e}
.bc-row{display:flex;justify-content:space-between;align-items:center;padding:3px 6px;font-size:13px;background:#14101ecc}
.pl{background:linear-gradient(#e07aff,#9a3ad6);border-radius:6px;padding:0 6px;border:1px solid #14101e}
.bt{color:#ffd23f}
/* brawler detail */
.bdetail{position:absolute;inset:0;display:flex;flex-direction:column}
.bdetail .topbar{position:relative;background:linear-gradient(#14101e99,transparent)}
.bside{position:absolute;right:0;top:64px;bottom:0;width:min(470px,58vw);background:#14101ee0;border-left:3px solid #14101e;border-top-left-radius:18px;padding:12px 14px 30px;overflow-y:auto;touch-action:pan-y}
.bhead{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.desc{font-family:system-ui,sans-serif;font-size:13px;opacity:.9;margin:8px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:#ffffff14;border-radius:10px;padding:6px 8px;font-size:12px;display:flex;flex-direction:column}
.stat span{opacity:.75;font-family:system-ui,sans-serif}.stat b{font-size:16px}.stat i{color:#5aff8a;font-style:normal;font-size:12px}
.acts{margin:10px 0}
.maxed{text-align:center;color:#ffd23f;padding:8px}
.bside h4{margin:14px 0 6px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.abil{display:flex;gap:10px;align-items:center;background:#ffffff10;border-radius:12px;padding:8px;margin:6px 0}
.abil>div{flex:1}.abil b{font-size:14px}.abil p{margin:2px 0 0;font-size:12px;font-family:system-ui,sans-serif;opacity:.85}
.abil:not(.own) .ic{filter:grayscale(.8) brightness(.8)}
.ok{color:#5aff8a;font-size:22px}.need{font-size:12px;opacity:.7;white-space:nowrap}
.skins{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.skin{flex:0 0 96px;border:3px solid #14101e;border-radius:12px;background:linear-gradient(var(--rc),#14101e);text-align:center;cursor:pointer;position:relative;padding-bottom:4px}
.skin img{width:100%;aspect-ratio:1;display:block}
.skin small{font-size:10.5px;display:block;padding:0 2px}
.skin em{font-style:normal;font-size:11px;display:block}
.skin.on{outline:3px solid #fff}.skin.eq em{color:#5aff8a}
.pins{display:flex;flex-wrap:wrap;gap:6px}
.pin{width:52px;text-align:center;font-size:10px}
.pin img{width:52px;height:52px}
.pin.lk img{filter:grayscale(1) brightness(.6)}
.pin.lk{cursor:pointer}
/* shop */
.shop h3{margin:10px 0 6px;font-size:18px}.shop h3 small{font-size:11px;opacity:.7;font-family:system-ui}
.srow{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;touch-action:pan-x pan-y}
.scard{flex:0 0 150px;border:3px solid #14101e;border-radius:14px;background:linear-gradient(color-mix(in srgb,var(--rc,#5a8cff) 80%,#fff),color-mix(in srgb,var(--rc,#5a8cff) 50%,#14101e));box-shadow:0 4px 0 #14101e;cursor:pointer;display:flex;flex-direction:column;overflow:hidden}
.scard.sold{filter:grayscale(.8) brightness(.7);cursor:default}
.scard.free{--rc:#3ee08a}
.sp{height:110px;display:flex;align-items:center;justify-content:center;background:radial-gradient(#ffffff55,#0000 70%)}
.sp img{height:100%}.sp .ic.big{width:64px;height:64px}
.gift{font-size:60px}
.stt{font-size:13px;text-align:center;padding:4px 6px;flex:1;text-shadow:0 2px 0 #14101e}
.sbtn{background:linear-gradient(#7ef06a,#2fb84a);border-top:3px solid #14101e;text-align:center;padding:6px;font-size:15px}
.sbtn.s{background:#555}
/* capsules */
.capsule{width:90px;height:90px;border-radius:50% 50% 46% 46%;border:4px solid #14101e;background:radial-gradient(circle at 35% 30%,#fff 0 8%,transparent 9%),radial-gradient(circle at 50% 60%,var(--c),color-mix(in srgb,var(--c) 45%,#14101e));box-shadow:0 6px 0 #14101e,0 0 30px var(--c);position:relative;margin:0 auto}
.capsule:after{content:"★";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;text-shadow:0 3px 0 #14101e}
.capsule.mini{width:46px;height:46px}.capsule.mini:after{font-size:20px}
.capsule.huge{width:180px;height:180px;cursor:pointer;animation:bob 1.2s ease-in-out infinite;transition:background .3s}
.capsule.huge:after{font-size:80px}
.capsule.shake{animation:shake .35s}
.capsule.flash{filter:brightness(2)}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes shake{20%{transform:rotate(-12deg) scale(1.08)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.caps{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-content:flex-start}
.capcard{background:#14101e88;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer;width:170px;text-align:center}
.empty{text-align:center;padding:40px;opacity:.8;font-family:system-ui}
.capopen{text-align:center;padding:10px 20px}.capopen p{font-family:system-ui;opacity:.9}
.revealbox{text-align:center;padding:10px 26px;min-width:240px}
.revealbox p{opacity:.6;font-size:12px}
.newb{color:#ffd23f;font-size:30px;animation:pop .5s}
.reward{display:flex;flex-direction:column;align-items:center;gap:2px;background:#ffffff14;border-radius:12px;padding:6px 10px;min-width:84px;border:2px solid var(--rc,transparent)}
.reward .rimg{width:56px;height:56px;object-fit:contain}
.reward .rt{font-size:14px}.reward .rs{font-size:10px;opacity:.75;font-family:system-ui;text-align:center;max-width:130px}
.reward.big{transform:scale(1.5);margin:30px 20px;animation:pop .45s}
.reward.big .rimg{width:90px;height:90px}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.7)}100%{transform:scale(1.5)}}
.newb{animation:pop2 .5s}@keyframes pop2{0%{transform:scale(.3)}100%{transform:scale(1)}}
/* road */
.roadtop{display:flex;align-items:center;gap:14px;justify-content:center;padding:6px}
.roadtop span{opacity:.7;font-size:13px}
.road{flex:1;display:flex;gap:12px;overflow-x:auto;align-items:center;padding:10px 20px 30px;touch-action:pan-x}
.rnode{flex:0 0 130px;background:#14101e99;border:3px solid #14101e;border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.rnode .rt{font-size:16px;color:#ffd23f}
.rnode.done{opacity:.55}.rnode.avail{border-color:#ffd23f;box-shadow:0 0 18px #ffd23f88}
.rnode .lk .ic{width:28px;height:28px}
/* quests */
.quests{display:flex;flex-direction:column;gap:10px;max-width:760px;margin:0 auto;width:100%}
.quest{display:flex;align-items:center;gap:12px;background:#14101e99;border-radius:14px;padding:10px 14px;border:3px solid #14101e}
.quest.cl{opacity:.5}.qt{flex:1}.qt b{font-size:15px}
.qbar{height:16px;background:#0008;border-radius:8px;margin-top:6px;position:relative;overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#5aff8a,#2fb84a)}
.qbar span{position:absolute;inset:0;font-size:11px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 0 #000}
/* modal */
.mback{position:absolute;inset:0;background:#0a0620b0;display:flex;align-items:center;justify-content:center;padding:14px}
.mbox{position:relative;background:linear-gradient(#3a4ae8,#2a1a90);border:4px solid #14101e;border-radius:18px;padding:18px;max-width:min(560px,96vw);max-height:92vh;overflow-y:auto;box-shadow:0 8px 0 #14101e;touch-action:pan-y}
.mbox.dark{background:radial-gradient(#3a2a9a,#160c50)}
.mbox h2,.mbox h3{margin:4px 0 10px;text-align:center}
.xbtn{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:10px;border:3px solid #14101e;background:linear-gradient(#ff7a7a,#e0303f);color:#fff;font-size:16px;z-index:2}
.settings label.row,.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#ffffff14;padding:8px 10px;border-radius:10px;margin:6px 0}
.settings input,.friends input,.settings select,.settings textarea{font-family:inherit;font-size:16px;padding:8px;border-radius:10px;border:3px solid #14101e;background:#fff;color:#14101e;min-width:0;user-select:text;-webkit-user-select:text}
.settings textarea{width:100%;font-size:11px;font-family:monospace}
.tog input{width:24px;height:24px}
.confirm{text-align:center;min-width:260px}
.friends{text-align:center}.friends p{font-family:system-ui;opacity:.85;font-size:14px}
.friends .or{opacity:.6;margin:8px}
.friends input{width:140px;text-align:center;font-size:22px;letter-spacing:3px}
/* room */
.room{display:flex;flex-direction:column;gap:10px;max-width:820px;margin:0 auto;width:100%}
.roomcode{display:flex;align-items:center;gap:12px;justify-content:center;background:#14101e99;border-radius:14px;padding:10px}
.roomcode b{font-size:34px;letter-spacing:6px;color:#ffd23f}
.status{text-align:center;font-family:system-ui;font-size:13px;opacity:.85}
.modeinfo{text-align:center;background:linear-gradient(var(--mc),color-mix(in srgb,var(--mc) 50%,#14101e));border:3px solid #14101e;border-radius:12px;padding:8px}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.seat{background:#14101e99;border:3px solid #14101e;border-radius:12px;padding:6px;text-align:center;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.seat.t0{border-color:#3d9bff}.seat.t1{border-color:#ff3d5e}.seat.me{box-shadow:0 0 0 3px #5aff8a}
.seat img{width:64px;height:64px}.seat small{font-size:11px;opacity:.8}.seat em{font-style:normal;font-size:11px}
.chip{border:2px solid #14101e;border-radius:10px;background:#14101e88;color:#fff;padding:6px 10px;font-size:13px}
.chip.on{background:var(--mc,#ffd23f);color:#fff}
.hostctl{background:#14101e55;border-radius:14px;padding:8px}
/* results */
.results>:first-child{margin-top:auto}.results>:last-child{margin-bottom:auto}
.results{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;background:radial-gradient(#3a5affdd,#14105aee);padding:14px;overflow-y:auto}
.results.lose{background:radial-gradient(#8a3a5add,#2a0a2aee)}
.results h1{font-size:46px;margin:0;color:#ffd23f;animation:pop2 .5s}
.results.lose h1{color:#ff8a9a}
.rbrawler{display:flex;align-items:center;gap:14px}
.rbrawler img{height:130px}
.tdelta{font-size:30px;display:flex;align-items:center;gap:6px}.tdelta.up{color:#ffd23f}.tdelta.down{color:#ff8a9a}
.rrew{display:flex;gap:10px}
.qdone{background:#14101e99;padding:6px 12px;border-radius:10px;font-size:13px}
.rplayers{display:flex;flex-direction:column;gap:6px;max-width:96vw}
.rteam{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:6px;border-radius:12px}
.rteam.mine{background:#3d9bff44}.rteam.enemy{background:#ff3d5e33}
.rp{display:flex;flex-direction:column;align-items:center;width:90px;font-size:12px;position:relative}
.rp img{width:56px;height:56px}.rp small{font-size:10px;opacity:.8;text-align:center}
.rp.me b{color:#5aff8a}.rp em{position:absolute;top:0;right:6px;background:#ffd23f;color:#14101e;font-style:normal;font-size:10px;border-radius:6px;padding:0 4px}
/* HUD */
.hud-top{position:absolute;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:none}
.score{display:flex;align-items:center;gap:8px;background:#14101ecc;border-radius:14px;padding:4px 12px;border:2px solid #0008}
.score .sc{font-size:22px;min-width:52px;text-align:center}
.sc.blue{color:#6ab8ff}.sc.red{color:#ff6a7e}.sc.green{color:#5aff8a}
.score .tm{font-size:18px;min-width:54px;text-align:center}

// trophies change by result
function trophyDelta(mode, result, trophies) {
  // result: 'win'|'lose'|'draw' or rank number for showdown
  const t = trophies;
  const tier = t < 50 ? 0 : t < 150 ? 1 : t < 300 ? 2 : t < 500 ? 3 : 4;
  if (mode === 'sd_solo') {
    const table = [[10,8,7,6,4,2,2,1,0,0],[10,8,7,6,4,2,1,0,-1,-2],[10,8,6,5,3,1,0,-2,-3,-4],[9,7,5,3,2,0,-2,-4,-6,-7],[8,6,4,2,0,-2,-4,-6,-8,-10]];
    return table[tier][U.clamp(result, 1, 10) - 1];
  }
  if (mode === 'sd_duo') {
    const table = [[9,7,4,0,0],[9,7,3,-1,-2],[9,6,2,-2,-4],[8,5,0,-4,-6],[7,4,-1,-6,-9]];
    return table[tier][U.clamp(result, 1, 5) - 1];
  }
  if (result === 'win') return [8, 8, 8, 7, 6][tier];
  if (result === 'draw') return 0;
  return [0, -2, -4, -6, -8][tier];
}

const TILE = { FLOOR: 0, WALL: 1, CRATE: 2, STONE: 3, BUSH: 4, WATER: 5, BOX: 6, GOAL_T: 7, GOAL_U: 8 };
const SOLID_MOVE = new Set([TILE.WALL, TILE.CRATE, TILE.STONE, TILE.WATER, TILE.BOX]);
const SOLID_SHOT = new Set([TILE.WALL, TILE.CRATE, TILE.STONE, TILE.BOX]);

function buildMap(id) {
  const d = MAP_DEFS.find(m => m.id === id) || MAP_DEFS[0];
  const rows = d.rows;
  let W, H, charAt;
  const swap = c => (c === '2' ? '1' : c === 'T' ? 'U' : c);
  if (d.sym === 'rot') {
    W = rows[0].length; const half = rows.length - 1; H = rows.length * 2 - 1;
    const get = (x, y) => { const r = rows[y] || ''; return r[x] || '.'; };
    charAt = (x, y) => {
      if (y < half) return get(x, y);
      if (y === half) { const mid = (W - 1) / 2; return x <= mid ? get(x, y) : swap(get(W - 1 - x, y)); }
      return swap(get(W - 1 - x, H - 1 - y));
    };
  } else {
    const q = rows.length; W = H = q * 2 - 1;
    charAt = (x, y) => { const qx = x < q ? x : W - 1 - x; const qy = y < q ? y : H - 1 - y; const r = rows[qy] || ''; return r[qx] || '.'; };
  }
  const tiles = new Uint8Array(W * H);
  const hp = new Float32Array(W * H);
  const m = { id: d.id, name: d.name, theme: d.theme, W, H, tiles, hp, spawns: [[], []], sdSpawns: [], mine: null, ball: null, star: null, boxes: [] };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = charAt(x, y); let t = TILE.FLOOR;
    switch (c) {
      case 'W': t = TILE.WALL; break;
      case 'X': t = TILE.CRATE; break;
      case '#': t = TILE.STONE; break;
      case 'b': t = TILE.BUSH; break;
      case '~': t = TILE.WATER; break;
      case 'P': t = TILE.BOX; hp[y * W + x] = 3000; m.boxes.push(y * W + x); break;
      case 'T': t = TILE.GOAL_T; break;
      case 'U': t = TILE.GOAL_U; break;
      case '1': m.spawns[0].push({ x: x + 0.5, y: y + 0.5 }); break;
      case '2': m.spawns[1].push({ x: x + 0.5, y: y + 0.5 }); break;
      case 's': m.sdSpawns.push({ x: x + 0.5, y: y + 0.5 }); break;
      case 'G': m.mine = { x: x + 0.5, y: y + 0.5 }; break;
      case 'B': m.ball = { x: x + 0.5, y: y + 0.5 }; break;
      case 'S': m.star = { x: x + 0.5, y: y + 0.5 }; break;
    }
    tiles[y * W + x] = t;
  }
  for (const s of m.spawns) s.sort((a, b) => a.x - b.x);
  if (!m.mine) m.mine = { x: W / 2, y: H / 2 };
  if (!m.ball) m.ball = { x: W / 2, y: H / 2 };
  return m;
}
function mapsForMode(mode) { return MAP_DEFS.filter(m => m.modes.includes(mode)); }

const SAVE_KEY = 'potasovka_save_v1';
const Save = {
  p: null,
  defaults() {
    const brawlers = {};
    for (const b of BRAWLERS) brawlers[b.id] = { unlocked: b.rarity === 'starter', level: 1, trophies: 0, best: 0, skin: b.id + ':default', skins: [b.id + ':default'], gadget: false, star: false, pins: [b.id + ':happy', b.id + ':sad', b.id + ':angry'] };
    return {
      v: 1, name: 'Игрок' + Math.floor(1000 + Math.random() * 9000),
      coins: 150, gems: 30, pp: 40, credits: 0,
      brawlers, selected: 'volt', mode: 'gem', map: { gem: 'gem1' },
      globalPins: ['g_gg', 'g_help', 'g_ok'],
      road: [], quests: null, shop: null, capsules: [],
      settings: { sound: true, quality: 'auto', autoAim: true, joy: 1 },
      stats: { games: 0, wins: 0, kills: 0, damage: 0, best: 0, sdWins: 0 },
      created: Date.now(),
    };
  },
  load() {
    let p = null;
    if (this.p && this.p.v === 1 && this.p.brawlers) p = this.p;
    else try { const s = localStorage.getItem(SAVE_KEY); if (s) p = JSON.parse(s); } catch (e) { p = null; }
    const d = this.defaults();
    if (!p || p.v !== 1) p = d;
    // merge new keys
    for (const k in d) if (p[k] === undefined) p[k] = d[k];
    for (const id in d.brawlers) if (!p.brawlers[id]) p.brawlers[id] = d.brawlers[id];
    for (const k in d.settings) if (p.settings[k] === undefined) p.settings[k] = d.settings[k];
    for (const k in d.stats) if (p.stats[k] === undefined) p.stats[k] = d.stats[k];
    if (!p.brawlers[p.selected] || !p.brawlers[p.selected].unlocked) p.selected = 'volt';
    this.p = p; this.refreshDaily(); return p;
  },
  save() { this.p.updated = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.p)); } catch (e) {} if (typeof Cloud !== 'undefined') Cloud.queue(); },
  adopt(p) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(p)); } catch (e) {} this.p = p; const keep = this.p.updated; this.load(); this.p.updated = keep; },
  exportCode() { try { return btoa(unescape(encodeURIComponent(JSON.stringify(this.p)))); } catch (e) { return ''; } },
  importCode(code) {
    try { const p = JSON.parse(decodeURIComponent(escape(atob(code.trim())))); if (p && p.v === 1 && p.brawlers) { this.p = p; this.save(); this.load(); return true; } } catch (e) {}
    return false;
  },
  reset() { this.p = this.defaults(); this.refreshDaily(); this.save(); },
  totalTrophies() { let s = 0; for (const id in this.p.brawlers) s += this.p.brawlers[id].trophies; return s; },
  b(id) { return this.p.brawlers[id]; },
  can(cost) { for (const k in cost) if ((this.p[k] || 0) < cost[k]) return false; return true; },
  pay(cost) { if (!this.can(cost)) return false; for (const k in cost) this.p[k] -= cost[k]; this.save(); return true; },
  // grant a reward object; returns description list
  grant(r) {
    const p = this.p; const out = [];
    switch (r.type) {
      case 'coins': case 'gems': case 'pp': case 'credits': p[r.type] += r.n; out.push(r); break;
      case 'brawler': {
        const st = p.brawlers[r.id];
        if (st && !st.unlocked) { st.unlocked = true; out.push(r); }
        else { const n = 100 * (RARITY[BRAWLER[r.id].rarity].order + 1); p.credits += n; out.push({ type: 'credits', n, dup: r.id }); }
        break;
      }
      case 'skin': {
        const s = SKINS[r.id]; const st = p.brawlers[s.brawler];
        if (!st.skins.includes(r.id)) { st.skins.push(r.id); if (!st.unlocked) { /* keep skin for later */ } out.push(r); }
        else { p.coins += s.price * 3; out.push({ type: 'coins', n: s.price * 3 }); }
        break;
      }
      case 'pin': {
        if (r.id.startsWith('g_')) { if (!p.globalPins.includes(r.id)) p.globalPins.push(r.id); }
        else { const bid = r.id.split(':')[0]; const st = p.brawlers[bid]; if (!st.pins.includes(r.id)) st.pins.push(r.id); }
        out.push(r); break;
      }
      case 'capsule': p.capsules.push(r.rarity); out.push(r); break;
    }
    this.save(); return out;
  },
  upgradeCost(id) {
    const st = this.p.brawlers[id]; if (st.level >= 11) return null;
    return { pp: UPGRADE.pp[st.level - 1], coins: UPGRADE.coins[st.level - 1] };
  },
  upgrade(id) {
    const c = this.upgradeCost(id); if (!c || !this.pay(c)) return false;
    this.p.brawlers[id].level++; this.save(); return true;
  },
  // ---- daily ----
  refreshDaily() {
    const day = U.dayKey(); const p = this.p;
    if (!p.quests || p.quests.day !== day) {
      const r = U.rng(U.hashStr(day + p.created));
      const t = U.shuffle(QUEST_TEMPLATES.slice(), r).slice(0, 3);
      p.quests = { day, list: t.map(q => ({ id: q.id, need: U.pick(q.n, r), have: 0, done: false, claimed: false })) };
    }
    if (!p.shop || p.shop.day !== day) {
      p.shop = { day, bought: [], free: false, offers: this.genOffers(day) };
    }
  },
  genOffers(day) {
    const r = U.rng(U.hashStr('shop' + day + this.p.created));
    const offers = [];
    // 2 skins
    const skinIds = U.shuffle(Object.keys(SKINS).filter(id => SKINS[id].price > 0), r);
    for (const id of skinIds.slice(0, 3)) offers.push({ id: 'o_' + id, title: SKINS[id].name, give: { type: 'skin', id }, cost: { gems: Math.round(SKINS[id].price * (r() < 0.3 ? 0.7 : 1)) } });
    // power points for a random brawler
    offers.push({ id: 'o_pp', title: '200 очков силы', give: { type: 'pp', n: 200 }, cost: { coins: 300 } });
    // pin
    const faces = PIN_FACES.filter(f => f.price > 0);
    const b = U.pick(BRAWLERS, r); const f = U.pick(faces, r);
    offers.push({ id: 'o_pin', title: 'Пин: ' + b.name + ' — ' + f.name, give: { type: 'pin', id: b.id + ':' + f.id }, cost: { gems: f.price } });
    const gp = U.pick(GLOBAL_PINS.filter(g => g.price > 0), r);
    offers.push({ id: 'o_gpin', title: 'Пин «' + gp.text + '»', give: { type: 'pin', id: gp.id }, cost: { gems: gp.price } });
    // capsule deal
    offers.push({ id: 'o_cap', title: 'Акция: эпическая капсула', give: { type: 'capsule', rarity: 'epic' }, cost: { gems: 49 } });
    return offers;
  },
  questProgress(stats) {
    const p = this.p; if (!p.quests) return [];
    const done = [];
    for (const q of p.quests.list) {
      if (q.done) continue;
      const t = QUEST_TEMPLATES.find(x => x.id === q.id);
      q.have += stats[t.stat] || 0;
      if (q.have >= q.need) { q.have = q.need; q.done = true; done.push(q); }
    }
    this.save(); return done;
  },
  // effective stats for a brawler instance
  rollCapsule(rarity, rnd = Math.random) {
    const p = this.p; const table = CAPSULE_LOOT[rarity];
    for (let tries = 0; tries < 10; tries++) {
      const e = U.weighted(table, rnd);
      if (e.type === 'brawler') {
        const locked = BRAWLERS.filter(b => !p.brawlers[b.id].unlocked && e.pool.includes(b.rarity));
        if (!locked.length) continue;
        return { type: 'brawler', id: U.pick(locked, rnd).id };
      }
      if (e.type === 'skin') {
        const ok = Object.values(SKINS).filter(s => s.price > 0 && s.price <= e.max && p.brawlers[s.brawler].unlocked && !p.brawlers[s.brawler].skins.includes(s.id));
        if (!ok.length) continue;
        return { type: 'skin', id: U.pick(ok, rnd).id };
      }
      if (e.type === 'pin') {
        const opts = [];
        for (const b of BRAWLERS) if (p.brawlers[b.id].unlocked) for (const f of PIN_FACES) { const id = b.id + ':' + f.id; if (!p.brawlers[b.id].pins.includes(id)) opts.push(id); }
        for (const g of GLOBAL_PINS) if (!p.globalPins.includes(g.id)) opts.push(g.id);
        if (!opts.length) continue;
        return { type: 'pin', id: U.pick(opts, rnd) };
      }
      const n = Math.round(U.lerp(e.n[0], e.n[1], rnd()));
      return { type: e.type, n };
    }
    return { type: 'coins', n: 50 };
  },
  capsuleRewards(rarity) {
    const count = { rare: 1, super: 2, epic: 3, mythic: 3, legendary: 4 }[rarity];
    const out = []; for (let i = 0; i < count; i++) out.push(this.rollCapsule(rarity));
    return out;
  },
};

function brawlerStats(id, level, gadget, star) {
  const b = BRAWLER[id]; const k = 1 + UPGRADE.perLevel * (level - 1);
  const s = { hp: Math.round(b.hp * k), dmgMul: k, speed: b.speed, reload: b.reload, range: 0, armor: 0, lifesteal: 0, superMul: 1, aoeMul: 1 };
  if (star) {
    const st = b.star;
    if (st.type === 'hp') s.hp = Math.round(s.hp * (1 + st.value));
    if (st.type === 'dmg') s.dmgMul *= 1 + st.value;
    if (st.type === 'speed') s.speed *= 1 + st.value;
    if (st.type === 'range') s.range = st.value;
    if (st.type === 'armor') s.armor = st.value;
    if (st.type === 'lifesteal') s.lifesteal = st.value;
    if (st.type === 'superCharge') s.superMul = 1 + st.value;
    if (st.type === 'aoe') s.aoeMul = 1 + st.value;
  }
  return s;
}

// ---- cloud save (artifact db capability, per-user private doc) ----
const Cloud = {
  ref: null, ready: false, busy: false, dirty: false, timer: null, status: 'off',
  async init(onReplace) {
    try {
      if (typeof window === 'undefined' || !window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      this.ref = db.doc('data/users/' + id + '/save');
      const snap = await this.ref.get();
      if (snap.exists) {
        const d = snap.data();
        if (d && typeof d.p === 'string') {
          const cloud = JSON.parse(d.p);
          if (cloud && cloud.v === 1 && cloud.brawlers && (cloud.updated || 0) > (Save.p.updated || 0)) { Save.adopt(cloud); onReplace && onReplace(); }
        }
      }
      this.ready = true; this.status = 'on'; this.queue();
    } catch (e) { this.status = 'off'; }
  },
  queue() {
    if (!this.ready) return; this.dirty = true;
    clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1500);
  },
  async flush() {
    if (!this.ready || this.busy || !this.dirty) return;
    this.busy = true; this.dirty = false;
    try { await this.ref.set({ p: JSON.stringify(Save.p), at: Date.now() }); this.status = 'on'; }
    catch (e) { if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { this.ready = false; this.status = 'off'; } else this.dirty = true; }
    this.busy = false; if (this.dirty) this.queue();
  },
};

  addPlayer(pc) {

    const p = {
      id: pc.id, kind: 'p', name: pc.name, team: pc.team, bid: pc.brawler, def, skin: pc.skin || pc.brawler + ':default', level: pc.level || 1,
      hasGadget: !!pc.gadget, hasStar: !!pc.star, st, baseHp: st.hp, maxHp: st.hp, hp: st.hp, x: 0, y: 0, z: 0, r: PLAYER_R, ang: pc.team === 0 ? -Math.PI / 2 : Math.PI / 2,
      alive: true, respawnT: 0, ammo: 3, cd: 0, sup: 0, gadUses: 3, gadCd: 0, out: false,

      lastAtk: -9, lastHurt: -9, revealT: 0, burst: null, dash: null, leap: null, knock: null,
      cubes: 0, gems: 0, stars: 2, ball: false, moving: false, inBush: false, hideMask: 0,

      bot: pc.bot ? { skill: pc.skill == null ? 0.5 : pc.skill } : null, human: pc.human || null, net: null,

      else this.players.forEach(p => { const s = sp[p.team % sp.length]; const k = this.players.filter(q => q.team === p.team).indexOf(p); p.x = s.x + (k ? 0.8 : -0.8); p.y = s.y; this.unstick(p); });

        list.forEach((p, i) => { const s = sp[Math.min(i, sp.length - 1)] || { x: m.W / 2, y: tm ? 1.5 : m.H - 1.5 }; p.x = s.x; p.y = s.y; p.spawnIdx = i; p.ang = tm === 0 ? -Math.PI / 2 : Math.PI / 2; });

}

        const a = Math.atan2(goal.y - p.y, goal.x - p.x); if (isLob || m.los(p.x, p.y, goal.x - Math.cos(a) * 0.6, goal.y - Math.sin(a) * 0.6)) { m.tryAttack(p, a, U.dist(p.x, p.y, goal.x, goal.y)); b.fireT = 0.4 + this.r() * 0.3; }

  }
}

// ---- 06_net ----
// ===== networking =====
// Every peer publishes a "state" object (merged patches). Host reads clients' states; clients read the host's.
class RoomTransport {
  constructor() { this.kind = 'room'; this.states = new Map(); this.cbState = null; this.cbPeers = null; this.me = null; this.nr = null; this.hostPeer = null; }
  static async available() {
    try { if (!window.claude || typeof window.claude.use !== 'function') return null; const r = await Promise.race([window.claude.use('room'), new Promise(res => setTimeout(() => res(null), 6000))]); return r || null; } catch (e) { return null; }
  }
  async open(code, asHost) {
    const room = await RoomTransport.available(); if (!room) throw new Error('room недоступен');
    this.nr = await room.join('pt-' + code);
    this.asHost = asHost;
    this.nr.onPeers(ch => {
      for (const p of ch.peers) {
        if (p.isMe && p.sameTab) { this.me = p.peer; continue; }
        if (p.kind !== 'viewer') continue;
        const prev = this.states.get(p.peer);
        if (!prev || prev.raw !== p.presence) { this.states.set(p.peer, { raw: p.presence }); if (this.cbState) this.cbState(p.peer, p.presence || {}); }
      }
      for (const p of ch.left) { this.states.delete(p.peer); }
      if (this.cbPeers) this.cbPeers([...this.states.keys()]);
    }, e => { if (this.cbError) this.cbError(e.message || e.code); });
    // wait for my own label
    const t0 = Date.now(); while (!this.me && Date.now() - t0 < 4000) await new Promise(r => setTimeout(r, 100));
    if (!this.me) this.me = 'me-' + U.code(6);
    return this.me;
  }
  setState(patch) { if (!this.nr) return; return this.nr.presence(patch).catch(e => { if (this.cbError) this.cbError(e.message || e.code); }); }
  onState(fn) { this.cbState = fn; }
  onPeers(fn) { this.cbPeers = fn; }
  peers() { return [...this.states.keys()]; }
  maxBytes() { return 3600; }
  close() { try { this.nr && this.nr.leave(); } catch (e) {} this.nr = null; }
}

class PeerTransport {

async function pickTransport() {
  if (/[?&]bc=1/.test(location.search)) return new BCTransport();

// ---- snapshot fitting ----
function fitSnapshot(S, maxBytes) {
  let s = JSON.stringify(S);
  if (s.length <= maxBytes) return S;
  const T = Object.assign({}, S);
  const prio = e => (e.k === 'dmg' || e.k === 'heal' || e.k === 'pend' ? 0 : e.k === 'hit' || e.k === 'atk' ? 1 : 2);
  T.E = S.E.filter(e => prio(e) > 0).slice(-14);
  s = JSON.stringify(T); if (s.length <= maxBytes) return T;
  T.E = S.E.filter(e => prio(e) > 1).slice(-8); T.B = S.B.slice(-30);
  s = JSON.stringify(T); if (s.length <= maxBytes) return T;
  T.B = S.B.slice(-12); T.E = T.E.slice(-4); T.D = S.D.slice(-40);
  return T;
}

function animateBrawler(model, t, moving, attackT, z) {
  const P = model.userData.parts; const rig = P.rig;
  const k = model.userData.kind;
  const sp = moving ? 12 : 2.5;
  rig.position.y = (k === 'shade' ? 0.12 + Math.sin(t * 3) * 0.06 : moving ? Math.abs(Math.sin(t * sp)) * 0.06 : Math.sin(t * 2.5) * 0.012);
  rig.rotation.x = moving ? 0.12 : 0;
  if (P.footL) { P.footL.position.z = 0.02 + (moving ? Math.sin(t * sp) * 0.13 : 0); P.footR.position.z = 0.02 - (moving ? Math.sin(t * sp) * 0.13 : 0); }
  if (attackT > 0) rig.scale.set(1 + attackT * 0.12, 1 - attackT * 0.12, 1 + attackT * 0.12); else rig.scale.set(1, 1, 1);
  if (P.wings) { P.wings[0].rotation.z = 0.6 + Math.sin(t * 20) * 0.3; P.wings[1].rotation.z = -0.6 - Math.sin(t * 20) * 0.3; }
  if (P.halo) P.halo.position.y = model.userData.headY + 0.43 + Math.sin(t * 3) * 0.03;
}

const Portraits = {
  cache: new Map(), r: null, scene: null, cam: null,
  init() {
    if (this.r) return;
    const c = document.createElement('canvas'); c.width = c.height = 192;
    this.r = new THREE.WebGLRenderer({ canvas: c, alpha: true, antialias: true, preserveDrawingBuffer: true });
    this.r.setPixelRatio(1); this.r.setSize(192, 192, false);
    this.scene = new THREE.Scene();
    this.scene.add(new THREE.HemisphereLight(0xffffff, 0x8899bb, 0.9));

    this.cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
  },
  get(skinId, full) {
    const key = skinId + (full ? 'F' : '');
    if (this.cache.has(key)) return this.cache.get(key);
    try {
      this.init();
      const m = buildBrawler(skinId); m.rotation.y = -0.45; this.scene.add(m);
      if (full) { this.cam.position.set(0, 0.95, 3.6); this.cam.lookAt(0, 0.62, 0); }
      else { this.cam.position.set(0, 1.05, 2.2); this.cam.lookAt(0, 0.82, 0); }
      this.r.render(this.scene, this.cam);
      const url = this.r.domElement.toDataURL('image/png');
      this.scene.remove(m); this.cache.set(key, url); return url;
    } catch (e) { return ''; }
  },
};

    const m = Game.match; if (!m || !this.els.score) return; const me = Game.meEnt();
    if (this.bannerT > 0) { this.bannerT -= dt; if (this.bannerT <= 0) this.els.banner.className = 'banner'; }
    // events for banners
    const evs = m.events; this.evSeen = this.evSeen || 0;
    for (const e of evs) {
      if (e.id <= this.evSeen) continue; this.evSeen = e.id;
      if (e.k === 'goal') this.banner(e.tm === (me ? me.team : 0) ? 'ГОЛ!' : 'ГОЛ СОПЕРНИКОВ', 2.2, e.tm === (me ? me.team : 0) ? 'good' : 'bad');
      if (e.k === 'round') this.banner(e.w < 0 ? 'Ничья в раунде' : e.w === (me ? me.team : 0) ? 'Раунд за вами!' : 'Раунд проигран', 2.2, e.w === (me ? me.team : 0) ? 'good' : 'bad');
      if (e.k === 'overtime') this.banner('ОВЕРТАЙМ!', 2, 'bad');
      if (e.k === 'kill' && me && e.by === me.id) this.banner('Враг повержен!', 1.2, 'good');
      if (e.k === 'elim' && m.isSD) { /* ignore */ }
      if (e.k === 'poison' && e.v === 1) this.banner('Ядовитое облако наступает!', 2, 'bad');
    }
    if (m.events.length && this.evSeen > m.events[m.events.length - 1].id) this.evSeen = 0;
    // center countdown
    const c = this.els.center;
    if (m.phase === 'intro') { const n = Math.ceil(m.phaseT); if (n !== this.lastCount) { this.lastCount = n; c.textContent = n > 0 ? (m.isRounds && m.round > 1 ? 'Раунд ' + m.round + ' · ' + n : n) : ''; c.className = 'centermsg pop'; if (n > 0) Sound.play('count'); } }
    else if (this.lastPh === 'intro' && m.phase === 'play') { c.textContent = 'В БОЙ!'; c.className = 'centermsg pop go'; this.lastCount = -1; setTimeout(() => { if (c.textContent === 'В БОЙ!') { c.className = 'centermsg'; c.textContent = ''; } }, 900); }
    else if (m.phase === 'end') { c.textContent = ''; }
    this.lastPh = m.phase;
    // score panel
    const s = this.els.score; const myT = me ? me.team : 0; const enT = 1 - myT;
    const timer = m.mode && m.mode.time < 900 ? U.fmtTime(m.timeLeft) : '';
    let html = '';
    if (m.modeId === 'gem') {
      const g = [0, 0]; for (const q of m.players) g[q.team] += q.gems || 0;
      const cd = m.gemLeader >= 0 ? '<div class="cd ' + (m.gemLeader === myT ? 'good' : 'bad') + '">' + Math.ceil(m.gemT) + '</div>' : '<div class="tm">' + timer + '</div>';
      html = `<div class="sc blue">💎 ${g[myT]}</div>${cd}<div class="sc red">${g[enT]} 💎</div>`;
    } else if (m.modeId === 'ball' || m.modeId === 'bounty') {
      const ic = m.modeId === 'ball' ? '⚽' : '★';
      html = `<div class="sc blue">${ic} ${m.score[myT]}</div><div class="tm">${m.overtime ? 'ОТ ' : ''}${timer}</div><div class="sc red">${m.score[enT]} ${ic}</div>`;
    } else if (m.isRounds) {
      const dots = (n) => '●'.repeat(n) + '○'.repeat(Math.max(0, 2 - n));
      html = `<div class="sc blue">${dots(m.roundWins[myT])}</div><div class="tm">Раунд ${m.round > 3 ? 3 : m.round}</div><div class="sc red">${dots(m.roundWins[enT])}</div>`;
    } else if (m.isSD) {
      const teams = new Set(); for (const q of m.players) if (!q.out) teams.add(q.team);
      html = `<div class="tm">☠ Осталось: ${m.modeId === 'sd_duo' ? teams.size + ' команд' : teams.size}</div>` + (me ? `<div class="sc green">■ ${me.cubes}</div>` : '');
    }
    if (s._h !== html) { s.innerHTML = html; s._h = html; }
    // respawn
    const rs = this.els.respawn;
    if (me && !me.alive && !me.out && me.respawnT > 0) { rs.classList.remove('hidden'); rs.textContent = 'Возрождение через ' + Math.ceil(me.respawnT); } else rs.classList.add('hidden');
    // super & gadget buttons
    if (me) {
      const S = Input.sticks;
      if (S.sup) { S.sup.style.setProperty('--f', (me.sup * 100).toFixed(0) + '%'); S.sup.classList.toggle('ready', me.sup >= 1); }
      if (S.gad) { const has = me.hasGadget; S.gad.classList.toggle('hidden', !has); S.gad.lastChild.textContent = me.gadUses; S.gad.classList.toggle('empty', !me.gadUses); }
      if (S.atk) S.atk.style.setProperty('--a', (U.clamp(me.ammo / 3, 0, 1) * 100).toFixed(0) + '%');
      const pc = this.els.pcbar; if (pc) { pc.firstChild.firstChild.style.width = (me.sup * 100) + '%'; pc.firstChild.classList.toggle('ready', me.sup >= 1); pc.lastChild.lastChild.textContent = me.hasGadget ? me.gadUses + ' шт.' : '—'; }
    }
    if (Game.role === 'client') this.els.net.classList.toggle('hidden', performance.now() - m.lastSnapAt < 3000 || !m.gotFirst);
  },
};

// ===== online rooms =====
const Online = {
  active: false, net: null, isHost: false, code: '', L: null, clients: new Map(), inputs: new Map(), status: '', hostPeer: null, lastStart: null, sendT: 0, cSendT: 0, seq: 0, matchId: 0,
  myChoice() { const p = Save.p; const st = p.brawlers[p.selected]; return { nm: p.name, bid: p.selected, skin: st.skin, lv: st.level, g: st.gadget ? 1 : 0, s: st.star ? 1 : 0 }; },
  async host() {
    this.reset(); this.isHost = true; this.code = U.code(5); this.active = true;
    this.L = { mode: Save.p.mode, map: (Save.p.map[Save.p.mode]) || mapsForMode(Save.p.mode)[0].id, bots: true, seats: [], st: 0, teams: {} };
    this.status = 'Создаём комнату…'; this.render();
    try {
      this.net = await pickTransport(); this.net.cbStatus = (t) => { this.status = t; this.render(); }; await this.net.open(this.code, true);
      this.status = this.net.kind === 'room' ? 'Комната открыта. Друзья заходят по коду в этой же игре.' : 'Комната открыта (PeerJS). Отправьте код друзьям.';
    } catch (e) { this.status = 'Ошибка: ' + e.message; this.render(); return; }
    this.net.onState((peer, st) => { if (st && st.C) { this.clients.set(peer, st.C); } if (st && st.I) this.inputs.set(peer, st.I); if (st && st.C) this.publishLobby(); });
    this.net.onPeers(list => { for (const k of [...this.clients.keys()]) if (!list.includes(k)) { this.clients.delete(k); this.inputs.delete(k); } this.publishLobby(); });
    this.net.cbError = (m) => { this.status = 'Сеть: ' + m; this.render(); };
    this.publishLobby();
  },
  async join(code) {
    this.reset(); this.isHost = false; this.code = code; this.active = true; this.status = 'Подключаемся…'; this.render();
    try { this.net = await pickTransport(); this.net.cbStatus = (t) => { this.status = t; this.render(); }; await this.net.open(code, false); }
    catch (e) { this.status = 'Ошибка: ' + e.message; this.render(); return; }
    this.status = 'Подключено. Ищем хоста…'; this.render();
    this.net.cbError = (m) => { this.status = 'Сеть: ' + m; if (Game.state !== 'match') this.render(); };
    this.net.onState((peer, st) => {
      if (!st || st.r !== 'h') return;
      this.hostPeer = peer;
      if (st.L) { const changed = JSON.stringify(st.L) !== JSON.stringify(this.L); this.L = st.L; if (changed && Game.state !== 'match' && Game.state !== 'results') { this.status = 'Вы в комнате.'; this.render(); } this.checkStart(); }
      if (st.S && Game.state === 'match' && Game.role === 'client' && st.S.mid === this.matchId) Game.match.apply(st.S);
    });
    this.net.setState({ C: this.myChoice() });
    setTimeout(() => { if (!this.hostPeer && this.active) { this.status = 'Хост не найден. Проверьте код комнаты.'; this.render(); } }, 8000);
  },
  reset() { if (this.net) this.net.close(); this.net = null; this.clients = new Map(); this.inputs = new Map(); this.L = null; this.hostPeer = null; this.lastStart = null; this.matchId = 0; },
  leave() { this.reset(); this.active = false; },
  render() {
    if (Game.state === 'match') return;
    const L = this.L ? JSON.parse(JSON.stringify(this.L)) : null;
    if (L && L.seats) for (const s of L.seats) s.me = this.isHost ? s.host : (s.peer === (this.net && this.net.me));
    UI.room({ code: this.code, isHost: this.isHost, L, status: this.status });
  },
  backToRoom() { this.render(); },
  updateChoice() { if (!this.net) return; if (this.isHost) this.publishLobby(); else this.net.setState({ C: this.myChoice() }); this.render(); },
  buildSeats() {
    const L = this.L; const mode = MODES[L.mode]; const max = mode.teams * mode.size;
    const seats = []; const c = this.myChoice();
    seats.push({ peer: 'host', host: true, name: c.nm, bid: c.bid, skin: c.skin, lv: c.lv, g: c.g, s: c.s });
    for (const [peer, ch] of this.clients) if (seats.length < max) seats.push({ peer, name: String(ch.nm || 'Игрок').slice(0, 16), bid: BRAWLER[ch.bid] ? ch.bid : 'volt', skin: SKINS[ch.skin] ? ch.skin : (ch.bid || 'volt') + ':default', lv: U.clamp(ch.lv | 0, 1, 11), g: ch.g ? 1 : 0, s: ch.s ? 1 : 0 });
    seats.forEach((s, i) => { s.team = L.teams[s.peer] != null ? L.teams[s.peer] : (mode.teams === 2 ? (L.bots ? 0 : i % 2) : (mode.size === 2 ? Math.floor(i / 2) : i)); });
    L.seats = seats;
  },
  publishLobby() {
    if (!this.isHost || !this.net) return;
    this.buildSeats();
    this.net.setState({ r: 'h', L: this.L });
    if (Game.state !== 'match') this.render();
  },
  setMode(id) { this.L.mode = id; this.L.map = mapsForMode(id)[0].id; this.L.teams = {}; this.publishLobby(); },
  setMap(id) { this.L.map = id; this.publishLobby(); },
  setBots(v) { this.L.bots = v; this.L.teams = {}; this.publishLobby(); },
  toggleTeam(i) {
    const s = this.L.seats[i]; if (!s) return; const mode = MODES[this.L.mode]; if (mode.teams !== 2 && mode.size !== 2) return;
    const nt = mode.teams === 2 ? 1 - s.team : (s.team + 1) % mode.teams;
    this.L.teams[s.peer] = nt; this.publishLobby();
  },
  start() {
    const L = this.L; const mode = MODES[L.mode]; this.buildSeats();
    const players = []; let id = 1;
    for (const s of L.seats) players.push({ id: id++, name: s.name, brawler: s.bid, skin: s.skin, level: s.lv, gadget: !!s.g, star: !!s.s, team: s.team, human: s.peer });
    if (mode.teams === 2) {
      const cnt = [0, 0]; for (const p of players) cnt[p.team]++;
      if (cnt[0] > mode.size || cnt[1] > mode.size) return UI.toast('В команде максимум ' + mode.size + ' игрока');
      if (L.bots) for (let t = 0; t < 2; t++) while (cnt[t] < mode.size) { const bid = U.pick(BRAWLERS).id; const lv = U.clamp(Math.round(players.reduce((a, p) => a + p.level, 0) / players.length), 1, 11); players.push({ id: id++, name: U.pick(BOT_NAMES), brawler: bid, skin: bid + ':default', level: lv, gadget: lv >= 7, star: lv >= 9, team: t, bot: true, skill: 0.55 }); cnt[t]++; }
      if (!cnt[0] || !cnt[1]) return UI.toast('Нужны игроки в обеих командах (или включите ботов)');
    } else {
      const used = new Set(players.map(p => p.team));
      if (L.bots) { let t = 0; const total = mode.teams * mode.size; while (players.length < total) { while ((players.filter(p => p.team === t).length) >= mode.size) t++; const bid = U.pick(BRAWLERS).id; players.push({ id: id++, name: U.pick(BOT_NAMES), brawler: bid, skin: bid + ':default', level: 7, gadget: true, star: false, team: t, bot: true, skill: 0.55 }); } }
      if (new Set(players.map(p => p.team)).size < 2) return UI.toast('Нужно хотя бы 2 участника');
    }
    this.matchId = Date.now() % 1e9;
    const cfg = { mode: L.mode, map: L.map, seed: Math.floor(Math.random() * 1e9), players };
    L.st = { id: this.matchId, cfg };
    this.net.setState({ r: 'h', L, S: null });
    Game.startMatch(cfg, 'host', 1);
    const me = Game.match.players[0]; me.human = 'host';
    for (const p of Game.match.players) if (p.human && p.human !== 'host') p.net = { x: p.x, y: p.y, has: false };
  },
  checkStart() {
    const st = this.L && this.L.st;
    if (!st || !st.id || st.id === this.lastStart) { if (!st && Game.state === 'match' && Game.role === 'client' && !Game.ended) { Game.ended = true; UI.toast('Хост завершил бой'); Game.leaveMatch(); } return; }
    this.lastStart = st.id; this.matchId = st.id;
    const myPeer = this.net.me; const mine = st.cfg.players.find(p => p.human === myPeer);
    Game.fireN = Game.supN = 0; Game.lastFire = Game.lastSup = Game.lastPin = null;
    Game.startMatch(st.cfg, 'client', mine ? mine.id : -1);
    if (!mine) HUD.banner('Вы зритель', 3);
  },
  // host per-frame
  hostReadInputs(m) {
    for (const p of m.players) {
      if (!p.human || p.human === 'host' || p.human === 'me') continue;
      const I = this.inputs.get(p.human); if (!I || I.mid !== this.matchId) continue;
      p.input.mx = U.clamp(+I.mx || 0, -1, 1); p.input.my = U.clamp(+I.my || 0, -1, 1); p.input.aim = I.a == null ? null : +I.a;
      if (I.f) p.input.fire = I.f; if (I.s) p.input.sup = I.s; if (I.g != null) p.input.gad = I.g; if (I.pn) p.input.pin = I.pn;
      if (I.sq !== p._sq && I.x != null) { p._sq = I.sq; p.net = p.net || {}; p.net.x = +I.x; p.net.y = +I.y; p.net.has = true; }
    }
  },
  hostSend(m, dt) {
    this.sendT -= dt; if (this.sendT > 0) return; this.sendT = this.net && this.net.kind === 'room' ? 1 / 12 : 1 / 20;
    const S = m.snapshot(0); S.E = m.events.filter(e => e.t > m.t - 0.7).slice(-40); S.mid = this.matchId;
    const Lsize = JSON.stringify(this.L).length;
    const fit = fitSnapshot(S, this.net.maxBytes() - Lsize - 60);
    this.net.setState({ S: fit });
  },
  hostEndMatch() { if (!this.isHost || !this.L) return; this.L.st = 0; this.net && this.net.setState({ r: 'h', L: this.L, S: null }); this.publishLobby(); },
  clientSend(dt, me, inp) {
    this.cSendT -= dt; if (this.cSendT > 0 || !this.net) return; this.cSendT = this.net.kind === 'room' ? 1 / 15 : 1 / 25;
    const I = { mid: this.matchId, mx: +(inp.mx || 0).toFixed(2), my: +(inp.my || 0).toFixed(2), a: inp.aim == null ? null : +inp.aim.toFixed(2), sq: ++this.seq, g: Input.gadget };
    if (me) { I.x = +me.x.toFixed(2); I.y = +me.y.toFixed(2); }
    if (Game.lastFire) I.f = Game.lastFire; if (Game.lastSup) I.s = Game.lastSup; if (Game.lastPin) I.pn = Game.lastPin;
    this.net.setState({ I });
  },
};

window.addEventListener('load', () => { try { Game.init(); } catch (e) { const l = document.getElementById('loading'); if (l) l.textContent = 'Ошибка запуска: ' + e.message; console.error(e); } });

</script>
